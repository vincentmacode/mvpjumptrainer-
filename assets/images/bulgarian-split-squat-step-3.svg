<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Bulgarian Split Squat Step 3 - Drive Up</title>
  <desc id="desc">Athlete presses through front leg to return to top with balance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6ed"/><stop offset="100%" stop-color="#ffe8d4"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 3: Press To Top</text>
  <text x="80" y="178" class="subtitle">Drive through front heel and squeeze glute</text>
  <rect x="620" y="830" width="170" height="30" rx="10" fill="#475569"/>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="480" cy="390" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="480" y1="450" x2="465" y2="680" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="465" y1="680" x2="380" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="380" y1="820" x2="350" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="465" y1="680" x2="580" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="580" y1="820" x2="660" y2="850" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="700" x2="540" y2="760" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="690" class="label">Front leg drive</text>
  <text x="80" y="1080" class="hint">Stay tall at top before next rep.</text>
</svg>
