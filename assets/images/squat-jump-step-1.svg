<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Squat Jump Step 1 - Setup</title>
  <desc id="desc">Athlete standing with feet shoulder width apart and chest up before descending into squat.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff" />
      <stop offset="100%" stop-color="#d9e9ff" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#bfdbfe" stroke-width="4" />

  <text x="80" y="130" class="title">Step 1: Starting Position</text>
  <text x="80" y="178" class="subtitle">Feet shoulder-width apart, core tight, chest up</text>

  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

  <circle cx="450" cy="360" r="62" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="450" y1="422" x2="450" y2="620" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="450" y1="470" x2="360" y2="560" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="450" y1="470" x2="540" y2="560" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="450" y1="620" x2="385" y2="780" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="385" y1="780" x2="375" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="450" y1="620" x2="515" y2="780" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="515" y1="780" x2="525" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="375" cy="970" rx="48" ry="14" fill="#1e293b" />
  <ellipse cx="525" cy="970" rx="48" ry="14" fill="#1e293b" />

  <line x1="260" y1="550" x2="350" y2="550" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="90" y="540" class="label">Arms ready</text>
  <text x="90" y="575" class="hint">Keep shoulders relaxed</text>

  <line x1="640" y1="690" x2="555" y2="760" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="640" y="680" class="label">Neutral spine</text>

  <line x1="620" y1="930" x2="545" y2="960" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="620" y="925" class="label">Feet planted</text>
</svg>
