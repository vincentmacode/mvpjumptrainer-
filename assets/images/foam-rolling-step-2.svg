<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Foam Rolling Step 2 - Slow Passes</title>
  <desc id="desc">Athlete rolls slowly along muscle fibers pausing at tight points for a few breaths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#effff6"/><stop offset="100%" stop-color="#d8f9e8"/></linearGradient>
    <style>.title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; } .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; } .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; } .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 2: Roll Slowly</text>
  <text x="80" y="178" class="subtitle">Move 2-3 inches per second</text>
  <line x1="260" y1="860" x2="640" y2="860" stroke="#111827" stroke-width="26" stroke-linecap="round"/>
  <circle cx="440" cy="640" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="440" y1="696" x2="540" y2="780" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="540" y1="780" x2="620" y2="860" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="540" y1="780" x2="500" y2="900" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="370" y1="720" x2="320" y2="840" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="410" y1="740" x2="360" y2="860" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="180" y1="860" x2="250" y2="860" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="720" y1="860" x2="650" y2="860" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="80" y="850" class="label">Slow back-and-forth</text>
  <text x="80" y="1080" class="hint">Pause 10-20 seconds on tender spots.</text>
</svg>
