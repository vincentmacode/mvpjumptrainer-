<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Broad Jump Step 2 - Explode Forward</title>
  <desc id="desc">Athlete drives forward in the air with full hip extension and arms reaching ahead for distance.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#effff6" />
      <stop offset="100%" stop-color="#d8f9e8" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#bbf7d0" stroke-width="4" />

  <text x="80" y="130" class="title">Step 2: Drive Forward</text>
  <text x="80" y="178" class="subtitle">Push through floor and project body ahead</text>

  <line x1="110" y1="980" x2="790" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round" />

  <path d="M290 860 C380 790, 470 730, 560 660" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="14 12" marker-end="url(#arrow)" />

  <circle cx="500" cy="440" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="500" y1="500" x2="560" y2="650" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="530" y1="560" x2="660" y2="610" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="530" y1="560" x2="610" y2="500" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="560" y1="650" x2="500" y2="760" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="500" y1="760" x2="450" y2="860" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="560" y1="650" x2="660" y2="720" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="660" y1="720" x2="740" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="450" cy="870" rx="42" ry="12" fill="#1e293b" />
  <ellipse cx="740" cy="820" rx="42" ry="12" fill="#1e293b" />

  <line x1="650" y1="610" x2="715" y2="610" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)" />
  <text x="600" y="590" class="label">Reach forward</text>

  <line x1="130" y1="855" x2="275" y2="850" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)" />
  <text x="90" y="840" class="label">Travel distance</text>

  <text x="80" y="1080" class="hint">Extend hips and keep core tight for a long, stable jump arc.</text>
</svg>
