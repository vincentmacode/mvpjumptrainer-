<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Box Jump Medium Step 1 - Set Distance</title>
  <desc id="desc">Athlete faces medium box and loads hips while keeping chest up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#d9e9ff"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 1: Medium Box Setup</text>
  <text x="80" y="178" class="subtitle">Load hips, arms back, eyes on top edge</text>
  <rect x="640" y="690" width="160" height="290" rx="8" fill="#475569"/>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="420" cy="430" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="420" y1="490" x2="400" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="400" y1="700" x2="320" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="400" y1="700" x2="510" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="700" x2="690" y2="700" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="560" y="680" class="label">Target box</text>
  <text x="80" y="1080" class="hint">Create tension before takeoff.</text>
</svg>
