<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Vertical Jump Test Step 1 - Measure Reach</title>
  <desc id="desc">Athlete stands side-on to wall and marks standing reach height before jumping.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#d9e9ff"/></linearGradient>
    <style>.title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; } .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; } .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; } .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <rect x="700" y="220" width="12" height="780" fill="#94a3b8"/>
  <text x="80" y="130" class="title">Step 1: Standing Reach</text>
  <text x="80" y="178" class="subtitle">Mark max reach with feet flat</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="470" cy="380" r="58" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="470" y1="438" x2="470" y2="660" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="470" y1="500" x2="390" y2="560" stroke="#0f172a" stroke-width="14"/>
  <line x1="470" y1="500" x2="690" y2="320" stroke="#0f172a" stroke-width="14"/>
  <line x1="470" y1="660" x2="420" y2="830" stroke="#0f172a" stroke-width="16"/>
  <line x1="470" y1="660" x2="520" y2="830" stroke="#0f172a" stroke-width="16"/>
  <line x1="620" y1="330" x2="700" y2="330" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="560" y="320" class="label">Mark line</text>
  <text x="80" y="1080" class="hint">Use chalk/tape so each attempt is clear.</text>
</svg>
