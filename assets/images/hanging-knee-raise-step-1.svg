<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hanging Knee Raise Step 1 - Active Hang</title>
  <desc id="desc">Athlete grips pull-up bar and creates active shoulder position before raising knees.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#d9e9ff"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <line x1="250" y1="260" x2="650" y2="260" stroke="#111827" stroke-width="18"/>
  <text x="80" y="130" class="title">Step 1: Active Hang</text>
  <text x="80" y="178" class="subtitle">Ribs down, legs long, avoid swinging</text>
  <circle cx="450" cy="360" r="58" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="450" y1="420" x2="450" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="360" y2="280" stroke="#0f172a" stroke-width="14"/>
  <line x1="450" y1="450" x2="540" y2="280" stroke="#0f172a" stroke-width="14"/>
  <line x1="450" y1="700" x2="405" y2="900" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="700" x2="495" y2="900" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="330" x2="540" y2="300" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="320" class="label">Packed shoulders</text>
  <text x="80" y="1080" class="hint">Start each rep from a controlled dead hang.</text>
</svg>
