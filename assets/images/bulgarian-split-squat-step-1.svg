<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Bulgarian Split Squat Step 1 - Rear Foot Setup</title>
  <desc id="desc">Athlete places rear foot on bench and sets front foot distance for balance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#d9e9ff"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 1: Rear Foot Elevated</text>
  <text x="80" y="178" class="subtitle">Set stance width and brace before lowering</text>
  <rect x="620" y="830" width="170" height="30" rx="10" fill="#475569"/>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="470" cy="390" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="470" y1="450" x2="455" y2="680" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="455" y1="680" x2="370" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="370" y1="820" x2="340" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="455" y1="680" x2="570" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="570" y1="820" x2="660" y2="850" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="815" x2="670" y2="840" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="800" class="label">Bench support</text>
  <text x="80" y="1080" class="hint">Front shin mostly vertical at setup.</text>
</svg>
