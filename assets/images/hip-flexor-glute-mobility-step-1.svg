<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="t d">
  <title id="t">Hip Flexor and Glute Mobility Step 1 - Half Kneeling Setup</title>
  <desc id="d">Athlete starts in half kneeling position to prepare for hip mobility drill.</desc>
  <defs>
    <style>.label { font: 600 27px Arial; fill: #0f172a; } .hint { font: 500 24px Arial; fill: #334155; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="#e8f2ff"/>
  <rect x="40" y="40" width="820" height="1120" rx="28" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" font-size="52" font-family="Arial" font-weight="700" fill="#0f172a">Step 1: Half-Kneeling Setup</text>
  <text x="80" y="185" font-size="30" font-family="Arial" fill="#1e3a8a">One knee down, front foot planted</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8"/>
  <circle cx="470" cy="400" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="470" y1="456" x2="470" y2="680" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="470" y1="680" x2="560" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="560" y1="820" x2="620" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="470" y1="680" x2="390" y2="830" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="420" cy="840" rx="54" ry="14" fill="#1e293b"/>
  <line x1="620" y1="830" x2="560" y2="830" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="820" class="label">Front foot flat</text>
  <text x="80" y="1080" class="hint">Start with ribs stacked over pelvis.</text>
</svg>
