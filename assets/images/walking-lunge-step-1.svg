<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Walking Lunge Step 1 - Start Tall</title>
  <desc id="desc">Athlete stands tall with feet hip width apart and core braced before stepping forward.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#d9e9ff"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 27px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 1: Start Tall</text>
  <text x="80" y="178" class="sub">Brace core and prepare to step forward</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="450" cy="350" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="450" y1="410" x2="450" y2="630" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="490" x2="370" y2="570" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="450" y1="490" x2="530" y2="570" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="450" y1="630" x2="400" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="630" x2="500" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="400" y1="810" x2="390" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="500" y1="810" x2="510" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="390" cy="970" rx="45" ry="14" fill="#1e293b"/>
  <ellipse cx="510" cy="970" rx="45" ry="14" fill="#1e293b"/>
  <line x1="620" y1="920" x2="540" y2="960" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="910" class="label">Feet under hips</text>
  <line x1="620" y1="700" x2="535" y2="770" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="690" class="label">Core braced</text>
  <text x="80" y="1080" class="hint">Keep shoulders stacked over hips.</text>
</svg>
