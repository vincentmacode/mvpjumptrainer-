<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Kettlebell Swing Step 3 - Re-Hinge and Repeat</title>
  <desc id="desc">Athlete lets bell fall, then re-hinges to load next explosive rep.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6ed"/><stop offset="100%" stop-color="#ffe8d4"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 3: Reset Hinge</text>
  <text x="80" y="178" class="subtitle">Catch bell path and reload hamstrings</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="450" cy="420" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="450" y1="480" x2="430" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="430" y1="700" x2="360" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="430" y1="700" x2="520" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <circle cx="450" cy="820" r="28" fill="#111827"/>
  <line x1="620" y1="790" x2="490" y2="820" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="780" class="label">Bell path back</text>
  <text x="80" y="1080" class="hint">Keep shoulders packed and wrists neutral.</text>
</svg>
