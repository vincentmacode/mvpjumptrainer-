<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="t d">
  <title id="t">Approach Jump Step 2 - Plant and Swing</title>
  <desc id="d">Athlete plants feet quickly and swings arms to transfer speed into vertical lift.</desc>
  <defs>
    <style>.label { font: 600 27px Arial; fill: #052e16; } .hint { font: 500 24px Arial; fill: #14532d; }</style>
