  </defs>
  <rect width="900" height="1200" fill="#eafced"/>
  <rect x="40" y="40" width="820" height="1120" rx="28" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" font-size="52" font-family="Arial" font-weight="700" fill="#052e16">Step 2: Plant</text>
  <text x="80" y="185" font-size="30" font-family="Arial" fill="#166534">Fast foot plant and powerful arm swing</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#4b5563" stroke-width="8"/>
