  <line x1="455" y1="680" x2="360" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="455" y1="680" x2="560" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="360" y1="810" x2="330" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="560" y1="810" x2="600" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="760" x2="560" y2="810" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="750" class="label">Fast plant</text>
