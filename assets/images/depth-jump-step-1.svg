<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="t d">
  <title id="t">Depth Jump Step 1 - Start On Box</title>
  <desc id="d">Athlete stands tall on a low box preparing to drop down with control.</desc>
  <defs>
    <style>.label { font: 600 27px Arial; fill: #0f172a; } .hint { font: 500 24px Arial; fill: #334155; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="#e8f2ff"/>
  <rect x="40" y="40" width="820" height="1120" rx="28" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" font-size="52" font-family="Arial" font-weight="700" fill="#0f172a">Step 1: Box Start</text>
  <text x="80" y="185" font-size="30" font-family="Arial" fill="#1e3a8a">Stand tall, then step off not jump off</text>
  <rect x="280" y="760" width="160" height="220" fill="#475569" rx="8"/>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8"/>
  <circle cx="360" cy="430" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="360" y1="486" x2="360" y2="690" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="360" y1="690" x2="330" y2="760" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="360" y1="690" x2="390" y2="760" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="330" cy="770" rx="30" ry="9" fill="#1e293b"/>
  <ellipse cx="390" cy="770" rx="30" ry="9" fill="#1e293b"/>
  <line x1="500" y1="760" x2="440" y2="760" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="500" y="750" class="label">Step off, don't jump</text>
  <text x="80" y="1080" class="hint">Keep posture tall before the drop.</text>
</svg>
