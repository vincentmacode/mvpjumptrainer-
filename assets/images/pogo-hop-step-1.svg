<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Pogo Hop Step 1 - Tall Stiff Setup</title>
  <desc id="desc">Athlete stands tall with feet under hips and slight ankle bend to prepare for quick reactive hops.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff" />
      <stop offset="100%" stop-color="#d9e9ff" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#bfdbfe" stroke-width="4" />

  <text x="80" y="130" class="title">Step 1: Tall Position</text>
  <text x="80" y="178" class="subtitle">Stay upright with quick, springy ankles</text>

  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

  <circle cx="450" cy="350" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="450" y1="410" x2="450" y2="620" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="450" y1="480" x2="365" y2="560" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="450" y1="480" x2="535" y2="560" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="450" y1="620" x2="400" y2="790" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="400" y1="790" x2="390" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="450" y1="620" x2="500" y2="790" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="500" y1="790" x2="510" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="390" cy="970" rx="46" ry="14" fill="#1e293b" />
  <ellipse cx="510" cy="970" rx="46" ry="14" fill="#1e293b" />

  <line x1="620" y1="920" x2="535" y2="955" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="620" y="905" class="label">Short ground contact</text>

  <line x1="140" y1="560" x2="350" y2="560" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="90" y="545" class="label">Quiet arms</text>

  <text x="80" y="1080" class="hint">Think "bounce" from ankles, not deep knee bend.</text>
</svg>
