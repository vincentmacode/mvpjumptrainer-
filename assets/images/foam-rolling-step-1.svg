<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Foam Rolling Step 1 - Position On Roller</title>
  <desc id="desc">Athlete places target muscle on foam roller with body supported by hands and opposite leg.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#d9e9ff"/></linearGradient>
    <style>.title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; } .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; } .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; } .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 1: Setup On Roller</text>
  <text x="80" y="178" class="subtitle">Find one muscle group and support body</text>
  <line x1="260" y1="860" x2="640" y2="860" stroke="#111827" stroke-width="26" stroke-linecap="round"/>
  <circle cx="420" cy="640" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="420" y1="696" x2="520" y2="780" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="520" y1="780" x2="610" y2="860" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="520" y1="780" x2="470" y2="900" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="350" y1="720" x2="290" y2="840" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="390" y1="740" x2="330" y2="860" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="620" y1="860" x2="560" y2="860" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="850" class="label">Foam roller</text>
  <text x="80" y="1080" class="hint">Keep pressure moderate, not painful.</text>
</svg>
