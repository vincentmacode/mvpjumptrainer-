<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hanging Knee Raise Step 2 - Lift Knees</title>
  <desc id="desc">Athlete contracts abs and hip flexors to raise knees toward chest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#effff6"/><stop offset="100%" stop-color="#d8f9e8"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <line x1="250" y1="260" x2="650" y2="260" stroke="#111827" stroke-width="18"/>
  <text x="80" y="130" class="title">Step 2: Knee Raise</text>
  <text x="80" y="178" class="subtitle">Posterior tilt and pull knees upward</text>
  <circle cx="450" cy="360" r="58" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="450" y1="420" x2="450" y2="670" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="360" y2="280" stroke="#0f172a" stroke-width="14"/>
  <line x1="450" y1="450" x2="540" y2="280" stroke="#0f172a" stroke-width="14"/>
  <line x1="450" y1="670" x2="400" y2="760" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="670" x2="500" y2="760" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="400" cy="770" rx="32" ry="10" fill="#1e293b"/>
  <ellipse cx="500" cy="770" rx="32" ry="10" fill="#1e293b"/>
  <line x1="620" y1="710" x2="520" y2="750" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="700" class="label">Core squeeze</text>
  <text x="80" y="1080" class="hint">Move slowly to avoid momentum.</text>
</svg>
