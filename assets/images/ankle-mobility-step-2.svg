<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Ankle Mobility Step 2 - Knee Over Toes</title>
  <desc id="desc">Athlete drives front knee forward while keeping heel down to mobilize ankle.</desc>
  <defs>
    <style>.title { font: 700 54px Arial; fill: #052e16; } .subtitle { font: 500 30px Arial; fill: #166534; } .label { font: 600 27px Arial; fill: #052e16; } .hint { font: 500 24px Arial; fill: #14532d; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="#eafced"/>
  <rect x="40" y="40" width="820" height="1120" rx="28" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 2: Knee Drive</text>
  <text x="80" y="185" class="subtitle">Move knee forward without lifting heel</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#4b5563" stroke-width="8"/>
  <circle cx="480" cy="390" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="480" y1="446" x2="455" y2="680" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="455" y1="680" x2="360" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="455" y1="680" x2="570" y2="800" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="360" y1="810" x2="320" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="570" y1="800" x2="620" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="640" y1="760" x2="575" y2="795" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="640" y="750" class="label">Knee tracks forward</text>
  <line x1="640" y1="930" x2="545" y2="960" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="640" y="920" class="label">Heel grounded</text>
  <text x="80" y="1080" class="hint">Stop before heel lifts or arch collapses.</text>
</svg>
