<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Kettlebell Swing Step 2 - Explosive Hip Snap</title>
  <desc id="desc">Athlete extends hips forcefully to float kettlebell to chest height.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#effff6"/><stop offset="100%" stop-color="#d8f9e8"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 2: Hip Drive</text>
  <text x="80" y="178" class="subtitle">Snap hips, kettlebell floats forward</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <circle cx="460" cy="360" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="460" y1="420" x2="460" y2="650" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="460" y1="490" x2="360" y2="430" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="460" y1="490" x2="560" y2="430" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="460" y1="650" x2="410" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="460" y1="650" x2="510" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <circle cx="560" cy="430" r="30" fill="#111827"/>
  <line x1="630" y1="430" x2="595" y2="430" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="630" y="420" class="label">Float, do not lift</text>
  <text x="80" y="1080" class="hint">Power comes from hips, not shoulders.</text>
</svg>
