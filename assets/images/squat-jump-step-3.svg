<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Squat Jump Step 3 - Explode Up and Land Softly</title>
  <desc id="desc">Athlete jumps upward by extending hips knees and ankles then lands softly with bent knees.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6ed" />
      <stop offset="100%" stop-color="#ffe8d4" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ea580c" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#fed7aa" stroke-width="4" />

  <text x="80" y="130" class="title">Step 3: Jump and Land</text>
  <text x="80" y="178" class="subtitle">Drive up fast, reach tall, then land softly</text>

  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

  <path d="M450 760 C420 720, 410 660, 430 600" fill="none" stroke="#fb923c" stroke-width="8" stroke-dasharray="14 12" marker-end="url(#arrow)" />
  <path d="M490 760 C520 720, 530 660, 510 600" fill="none" stroke="#fb923c" stroke-width="8" stroke-dasharray="14 12" marker-end="url(#arrow)" />

  <circle cx="470" cy="300" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="470" y1="360" x2="470" y2="560" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="470" y1="430" x2="360" y2="320" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="470" y1="430" x2="580" y2="320" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="470" y1="560" x2="430" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="470" y1="560" x2="520" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="430" cy="710" rx="42" ry="12" fill="#1e293b" />
  <ellipse cx="520" cy="710" rx="42" ry="12" fill="#1e293b" />

  <line x1="130" y1="350" x2="330" y2="330" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)" />
  <text x="90" y="330" class="label">Arms up</text>

  <line x1="640" y1="590" x2="535" y2="670" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)" />
  <text x="640" y="580" class="label">Extend hips</text>

  <line x1="640" y1="950" x2="545" y2="930" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)" />
  <text x="640" y="940" class="label">Soft landing</text>

  <text x="80" y="1080" class="hint">Land quietly with knees bent, then reset for the next rep.</text>
</svg>
