<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hanging Knee Raise Step 3 - Lower Under Control</title>
  <desc id="desc">Athlete lowers legs smoothly back to start while keeping tension.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6ed"/><stop offset="100%" stop-color="#ffe8d4"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <line x1="250" y1="260" x2="650" y2="260" stroke="#111827" stroke-width="18"/>
  <text x="80" y="130" class="title">Step 3: Controlled Return</text>
  <text x="80" y="178" class="subtitle">Lower legs slowly and reset without swing</text>
  <circle cx="450" cy="360" r="58" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="450" y1="420" x2="450" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="360" y2="280" stroke="#0f172a" stroke-width="14"/>
  <line x1="450" y1="450" x2="540" y2="280" stroke="#0f172a" stroke-width="14"/>
  <line x1="450" y1="700" x2="410" y2="900" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="700" x2="490" y2="900" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="880" x2="520" y2="860" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="870" class="label">No swinging</text>
  <text x="80" y="1080" class="hint">Exhale on effort, inhale on the way down.</text>
</svg>
