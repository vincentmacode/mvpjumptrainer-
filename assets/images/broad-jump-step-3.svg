<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Broad Jump Step 3 - Stick The Landing</title>
  <desc id="desc">Athlete lands in a deep athletic position with arms forward and knees bent to absorb impact.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6ed" />
      <stop offset="100%" stop-color="#ffe8d4" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ea580c" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#fed7aa" stroke-width="4" />

  <text x="80" y="130" class="title">Step 3: Land and Stick</text>
  <text x="80" y="178" class="subtitle">Absorb impact softly and hold position</text>

  <line x1="110" y1="980" x2="790" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

  <circle cx="560" cy="430" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="560" y1="490" x2="520" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="540" y1="560" x2="410" y2="620" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="540" y1="560" x2="650" y2="620" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="520" y1="700" x2="430" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="430" y1="820" x2="360" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="520" y1="700" x2="615" y2="815" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="615" y1="815" x2="680" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="360" cy="970" rx="50" ry="14" fill="#1e293b" />
  <ellipse cx="680" cy="970" rx="50" ry="14" fill="#1e293b" />

  <line x1="140" y1="620" x2="390" y2="620" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)" />
  <text x="90" y="605" class="label">Arms counterbalance</text>

  <line x1="710" y1="820" x2="625" y2="835" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)" />
  <text x="710" y="810" class="label">Knees bent</text>

  <text x="80" y="1080" class="hint">Land quietly and hold your chest up before resetting.</text>
</svg>
