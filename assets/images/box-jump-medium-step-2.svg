<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Box Jump Medium Step 2 - Explosive Takeoff</title>
  <desc id="desc">Athlete extends hips, knees, and ankles to clear box with knees up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#effff6"/><stop offset="100%" stop-color="#d8f9e8"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 2: Jump Up</text>
  <text x="80" y="178" class="subtitle">Drive upward and tuck to clear the box</text>
  <rect x="640" y="690" width="160" height="290" rx="8" fill="#475569"/>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <circle cx="560" cy="380" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="560" y1="440" x2="560" y2="630" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="560" y1="630" x2="500" y2="730" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="560" y1="630" x2="620" y2="730" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="500" cy="740" rx="36" ry="10" fill="#1e293b"/>
  <ellipse cx="620" cy="740" rx="36" ry="10" fill="#1e293b"/>
  <line x1="640" y1="520" x2="720" y2="650" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="640" y="510" class="label">Upward path</text>
  <text x="80" y="1080" class="hint">Land softly with knees tracking over toes.</text>
</svg>
