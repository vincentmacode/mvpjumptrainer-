<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Box Jump Medium Step 3 - Stick Landing</title>
  <desc id="desc">Athlete lands balanced on box and stands fully before stepping down.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6ed"/><stop offset="100%" stop-color="#ffe8d4"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 3: Controlled Stand</text>
  <text x="80" y="178" class="subtitle">Absorb impact then stand tall on box</text>
  <rect x="640" y="690" width="160" height="290" rx="8" fill="#475569"/>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="720" cy="390" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="720" y1="446" x2="710" y2="650" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="710" y1="650" x2="680" y2="720" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="710" y1="650" x2="740" y2="720" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="680" cy="730" rx="30" ry="9" fill="#1e293b"/>
  <ellipse cx="740" cy="730" rx="30" ry="9" fill="#1e293b"/>
  <line x1="600" y1="740" x2="665" y2="730" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="520" y="730" class="label">Soft landing</text>
  <text x="80" y="1080" class="hint">Step down safely; do not jump down between reps.</text>
</svg>
