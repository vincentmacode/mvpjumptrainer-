<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Pogo Hop Step 2 - Quick Rebound</title>
  <desc id="desc">Athlete performs a small rapid hop upward by rebounding off the forefoot and ankles.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#effff6" />
      <stop offset="100%" stop-color="#d8f9e8" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#bbf7d0" stroke-width="4" />

  <text x="80" y="130" class="title">Step 2: Pop Up Fast</text>
  <text x="80" y="178" class="subtitle">Use ankles to rebound quickly off the floor</text>

  <line x1="120" y1="980" x2="780" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round" />

  <path d="M430 910 C430 850, 430 800, 430 740" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="14 12" marker-end="url(#arrow)" />
  <path d="M510 910 C510 850, 510 800, 510 740" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="14 12" marker-end="url(#arrow)" />

  <circle cx="470" cy="300" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="470" y1="360" x2="470" y2="560" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="470" y1="430" x2="390" y2="500" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="470" y1="430" x2="550" y2="500" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="470" y1="560" x2="430" y2="710" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="470" y1="560" x2="510" y2="710" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="430" cy="720" rx="38" ry="12" fill="#1e293b" />
  <ellipse cx="510" cy="720" rx="38" ry="12" fill="#1e293b" />

  <line x1="620" y1="710" x2="540" y2="715" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)" />
  <text x="620" y="695" class="label">Small jump</text>

  <line x1="620" y1="950" x2="525" y2="965" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)" />
  <text x="620" y="935" class="label">Rebound quickly</text>

  <text x="80" y="1080" class="hint">Minimize knee bend and keep rhythm smooth.</text>
</svg>
