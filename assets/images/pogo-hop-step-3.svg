<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Pogo Hop Step 3 - Repeat Rhythmically</title>
  <desc id="desc">Athlete lands lightly on forefoot and immediately transitions into the next reactive hop.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6ed" />
      <stop offset="100%" stop-color="#ffe8d4" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ea580c" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#fed7aa" stroke-width="4" />

  <text x="80" y="130" class="title">Step 3: Land and Repeat</text>
  <text x="80" y="178" class="subtitle">Stay springy for continuous pogo hops</text>

  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

  <circle cx="450" cy="380" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="450" y1="440" x2="450" y2="650" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="450" y1="510" x2="370" y2="575" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="450" y1="510" x2="530" y2="575" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="450" y1="650" x2="400" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="400" y1="820" x2="410" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="450" y1="650" x2="500" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="500" y1="820" x2="490" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="410" cy="970" rx="44" ry="14" fill="#1e293b" />
  <ellipse cx="490" cy="970" rx="44" ry="14" fill="#1e293b" />

  <path d="M620 840 Q660 790 620 740" fill="none" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)" />
  <text x="620" y="730" class="label">Quick rhythm</text>

  <line x1="620" y1="945" x2="525" y2="965" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)" />
  <text x="620" y="930" class="label">Light contact</text>

  <text x="80" y="1080" class="hint">Stay tall and reactive from ankles for each rep.</text>
</svg>
