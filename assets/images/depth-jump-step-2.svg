<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="t d">
  <title id="t">Depth Jump Step 2 - Ground Contact</title>
  <desc id="d">Athlete lands and absorbs force with bent knees and hips ready to rebound.</desc>
  <defs>
    <style>.label { font: 600 27px Arial; fill: #052e16; } .hint { font: 500 24px Arial; fill: #14532d; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="#eafced"/>
  <rect x="40" y="40" width="820" height="1120" rx="28" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" font-size="52" font-family="Arial" font-weight="700" fill="#052e16">Step 2: Quick Absorb</text>
  <text x="80" y="185" font-size="30" font-family="Arial" fill="#166534">Land softly with short ground contact</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#4b5563" stroke-width="8"/>
  <circle cx="480" cy="430" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="480" y1="486" x2="455" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="455" y1="700" x2="365" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="455" y1="700" x2="570" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="365" y1="820" x2="335" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="570" y1="810" x2="610" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="810" x2="565" y2="810" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="800" class="label">Short contact</text>
  <text x="80" y="1080" class="hint">Absorb quickly, then prepare to rebound.</text>
</svg>
