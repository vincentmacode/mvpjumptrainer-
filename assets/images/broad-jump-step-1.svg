<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Broad Jump Step 1 - Setup Position</title>
  <desc id="desc">Athlete in loaded quarter squat with hips back and arms behind to prepare for a horizontal jump.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff" />
      <stop offset="100%" stop-color="#d9e9ff" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#bfdbfe" stroke-width="4" />

  <text x="80" y="130" class="title">Step 1: Load Back</text>
  <text x="80" y="178" class="subtitle">Hinge hips, bend knees, arms swing behind body</text>

  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

  <circle cx="430" cy="420" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="430" y1="480" x2="410" y2="680" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="420" y1="550" x2="300" y2="640" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="420" y1="550" x2="500" y2="670" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="410" y1="680" x2="330" y2="810" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="330" y1="810" x2="295" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="410" y1="680" x2="525" y2="790" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="525" y1="790" x2="560" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="295" cy="970" rx="50" ry="14" fill="#1e293b" />
  <ellipse cx="560" cy="970" rx="50" ry="14" fill="#1e293b" />

  <line x1="120" y1="650" x2="285" y2="645" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="80" y="635" class="label">Arms back</text>

  <line x1="620" y1="790" x2="530" y2="795" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="620" y="780" class="label">Load glutes</text>

  <text x="80" y="1080" class="hint">Keep weight centered and eyes forward before takeoff.</text>
</svg>
