<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lateral Bound Step 2 - Jump Sideways</title>
  <desc id="desc">Athlete drives explosively across to the side while staying tall through the torso and hips.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#effff6" />
      <stop offset="100%" stop-color="#d8f9e8" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#bbf7d0" stroke-width="4" />

  <text x="80" y="130" class="title">Step 2: Bound Across</text>
  <text x="80" y="178" class="subtitle">Push hard off planted foot and travel laterally</text>

  <line x1="110" y1="980" x2="790" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round" />

  <path d="M250 880 C360 800, 470 740, 620 700" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="14 12" marker-end="url(#arrow)" />

  <circle cx="500" cy="430" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="500" y1="490" x2="500" y2="680" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="500" y1="560" x2="420" y2="620" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="500" y1="560" x2="590" y2="620" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="500" y1="680" x2="445" y2="780" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="445" y1="780" x2="420" y2="870" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="500" y1="680" x2="590" y2="760" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="590" y1="760" x2="660" y2="840" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="420" cy="880" rx="42" ry="12" fill="#1e293b" />
  <ellipse cx="660" cy="850" rx="42" ry="12" fill="#1e293b" />

  <line x1="640" y1="700" x2="730" y2="700" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)" />
  <text x="610" y="680" class="label">Move sideways</text>

  <line x1="120" y1="875" x2="235" y2="875" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)" />
  <text x="80" y="860" class="label">Explode off foot</text>

  <text x="80" y="1080" class="hint">Stay square through shoulders and hips as you travel.</text>
</svg>
