<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Vertical Jump Test Step 3 - Record Best Attempt</title>
  <desc id="desc">Athlete lands softly, rests, and records best jump difference from standing reach.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6ed"/><stop offset="100%" stop-color="#ffe8d4"/></linearGradient>
    <style>.title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; } .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; } .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; } .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <rect x="700" y="220" width="12" height="780" fill="#94a3b8"/>
  <text x="80" y="130" class="title">Step 3: Record Result</text>
  <text x="80" y="178" class="subtitle">Best jump mark minus standing reach</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="470" cy="410" r="58" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="470" y1="468" x2="455" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="455" y1="700" x2="370" y2="820" stroke="#0f172a" stroke-width="16"/>
  <line x1="455" y1="700" x2="560" y2="820" stroke="#0f172a" stroke-width="16"/>
  <rect x="560" y="690" width="110" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="585" y1="720" x2="645" y2="720" stroke="#334155" stroke-width="4"/>
  <line x1="620" y1="690" x2="620" y2="760" stroke="#334155" stroke-width="4"/>
  <line x1="620" y1="760" x2="680" y2="820" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="850" class="label">Log best score</text>
  <text x="80" y="1080" class="hint">Rest 60-90s between attempts for true max effort.</text>
</svg>
