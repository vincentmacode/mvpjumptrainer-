<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Vertical Jump Test Step 2 - Jump Max Height</title>
  <desc id="desc">Athlete countermoves and jumps to touch highest possible point on wall.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#effff6"/><stop offset="100%" stop-color="#d8f9e8"/></linearGradient>
    <style>.title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; } .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; } .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; } .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <rect x="700" y="220" width="12" height="780" fill="#94a3b8"/>
  <text x="80" y="130" class="title">Step 2: Max Jump</text>
  <text x="80" y="178" class="subtitle">Explode up and touch highest point</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <circle cx="500" cy="300" r="58" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="500" y1="358" x2="500" y2="560" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="500" y1="420" x2="430" y2="330" stroke="#0f172a" stroke-width="14"/>
  <line x1="500" y1="420" x2="700" y2="250" stroke="#0f172a" stroke-width="14"/>
  <line x1="500" y1="560" x2="450" y2="700" stroke="#0f172a" stroke-width="16"/>
  <line x1="500" y1="560" x2="550" y2="700" stroke="#0f172a" stroke-width="16"/>
  <ellipse cx="450" cy="710" rx="36" ry="10" fill="#1e293b"/>
  <ellipse cx="550" cy="710" rx="36" ry="10" fill="#1e293b"/>
  <line x1="620" y1="260" x2="700" y2="260" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="560" y="250" class="label">Touch point</text>
  <text x="80" y="1080" class="hint">Use the same arm each attempt for consistency.</text>
</svg>
