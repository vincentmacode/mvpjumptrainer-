  <line x1="198" y1="430" x2="495" y2="620" stroke="#ea580c" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <text class="label" x="88" y="420">Hips stay level</text>

  <rect x="88" y="1030" width="724" height="88" rx="16" fill="#ffedd5"/>
  <text class="hint" x="112" y="1085">Cue: "Fast feet, tall hips, attack the ground"</text>
