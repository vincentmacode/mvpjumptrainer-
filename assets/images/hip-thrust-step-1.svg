<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hip Thrust Step 1 - Setup On Bench</title>
  <desc id="desc">Athlete sets upper back on bench with knees bent and feet planted before lifting hips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#d9e9ff"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 27px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 1: Setup</text>
  <text x="80" y="178" class="sub">Shoulder blades on bench, feet flat</text>
  <rect x="520" y="640" width="230" height="28" rx="8" fill="#475569"/>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="540" cy="560" r="50" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="520" y1="580" x2="430" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="430" y1="700" x2="340" y2="770" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="340" y1="770" x2="300" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="300" cy="970" rx="45" ry="14" fill="#1e293b"/>
  <line x1="640" y1="650" x2="610" y2="650" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="640" y="640" class="label">Bench support</text>
  <line x1="620" y1="930" x2="545" y2="960" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="920" class="label">Feet planted</text>
  <text x="80" y="1080" class="hint">Tuck chin slightly and brace your core.</text>
</svg>
