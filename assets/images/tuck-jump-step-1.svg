<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Tuck Jump Step 1 - Ready Position</title>
  <desc id="desc">Athlete in athletic stance with knees slightly bent and arms set to swing before takeoff.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff" />
      <stop offset="100%" stop-color="#d9e9ff" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#bfdbfe" stroke-width="4" />

  <text x="80" y="130" class="title">Step 1: Athletic Stance</text>
  <text x="80" y="178" class="subtitle">Soft knees, tall chest, prepare to explode up</text>

  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

  <circle cx="450" cy="350" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="450" y1="410" x2="450" y2="620" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="450" y1="480" x2="360" y2="570" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="450" y1="480" x2="540" y2="570" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="450" y1="620" x2="385" y2="770" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="385" y1="770" x2="395" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="450" y1="620" x2="515" y2="770" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="515" y1="770" x2="505" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="395" cy="970" rx="48" ry="14" fill="#1e293b" />
  <ellipse cx="505" cy="970" rx="48" ry="14" fill="#1e293b" />

  <line x1="140" y1="560" x2="345" y2="565" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="90" y="545" class="label">Arms ready</text>

  <line x1="630" y1="715" x2="535" y2="760" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)" />
  <text x="630" y="705" class="label">Load legs</text>

  <text x="80" y="1080" class="hint">Stay balanced through midfoot before initiating the jump.</text>
</svg>
