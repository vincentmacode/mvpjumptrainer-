<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Light Core Step 3 - Reset Between Sets</title>
  <desc id="desc">Athlete resets posture and breathing between short core sets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6ed"/><stop offset="100%" stop-color="#ffe8d4"/></linearGradient>
    <style>.title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; } .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; } .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; } .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 3: Quality Over Quantity</text>
  <text x="80" y="178" class="subtitle">Reset and repeat with the same precision</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8"/>
  <circle cx="360" cy="640" r="48" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="395" y1="660" x2="570" y2="700" stroke="#0f172a" stroke-width="16"/>
  <line x1="570" y1="700" x2="730" y2="760" stroke="#0f172a" stroke-width="16"/>
  <line x1="730" y1="760" x2="790" y2="920" stroke="#0f172a" stroke-width="16"/>
  <line x1="470" y1="680" x2="410" y2="790" stroke="#0f172a" stroke-width="14"/>
  <line x1="520" y1="695" x2="460" y2="805" stroke="#0f172a" stroke-width="14"/>
  <line x1="620" y1="900" x2="560" y2="840" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="930" class="label">Brief reset</text>
  <text x="80" y="1080" class="hint">Finish fresh, not exhausted, before testing day ends.</text>
</svg>
