<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hip Thrust Step 3 - Lower With Control</title>
  <desc id="desc">Athlete lowers hips under control to reset and repeat without collapsing posture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6ed"/>
      <stop offset="100%" stop-color="#ffe8d4"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .sub { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 27px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ea580c" />
    </marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 3: Controlled Lower</text>
  <text x="80" y="178" class="sub">Descend smoothly and keep knees stable</text>
  <rect x="520" y="650" width="230" height="28" rx="8" fill="#475569"/>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="540" cy="570" r="50" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="520" y1="590" x2="420" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="420" y1="700" x2="320" y2="790" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="320" y1="790" x2="280" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="280" cy="970" rx="45" ry="14" fill="#1e293b"/>
  <line x1="620" y1="760" x2="560" y2="760" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="750" class="label">Lower smooth</text>
  <line x1="620" y1="930" x2="545" y2="960" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="920" class="label">Knees stable</text>
  <text x="80" y="1080" class="hint">Do not overarch low back while lowering.</text>
</svg>
