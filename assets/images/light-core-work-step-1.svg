<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Light Core Step 1 - Brace Setup</title>
  <desc id="desc">Athlete starts in low-tension core position, bracing abs and glutes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#d9e9ff"/></linearGradient>
    <style>.title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; } .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; } .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; } .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 1: Brace Position</text>
  <text x="80" y="178" class="subtitle">Neutral spine and controlled breathing</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8"/>
  <circle cx="360" cy="640" r="48" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="395" y1="660" x2="570" y2="700" stroke="#0f172a" stroke-width="16"/>
  <line x1="570" y1="700" x2="730" y2="760" stroke="#0f172a" stroke-width="16"/>
  <line x1="730" y1="760" x2="790" y2="920" stroke="#0f172a" stroke-width="16"/>
  <line x1="470" y1="680" x2="410" y2="790" stroke="#0f172a" stroke-width="14"/>
  <line x1="520" y1="695" x2="460" y2="805" stroke="#0f172a" stroke-width="14"/>
  <line x1="620" y1="690" x2="560" y2="700" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="680" class="label">Core on</text>
  <text x="80" y="1080" class="hint">Keep effort moderate, this is activation not fatigue.</text>
</svg>
