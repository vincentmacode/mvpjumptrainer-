<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="t d">
  <title id="t">Approach Jump Step 1 - Controlled Approach</title>
  <desc id="d">Athlete takes measured approach steps to build momentum before takeoff.</desc>
  <defs>
    <style>.label { font: 600 27px Arial; fill: #0f172a; } .hint { font: 500 24px Arial; fill: #334155; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="#e8f2ff"/>
  <rect x="40" y="40" width="820" height="1120" rx="28" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" font-size="52" font-family="Arial" font-weight="700" fill="#0f172a">Step 1: Approach Steps</text>
  <text x="80" y="185" font-size="30" font-family="Arial" fill="#1e3a8a">Smooth rhythm into penultimate step</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8"/>
  <circle cx="420" cy="380" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="420" y1="436" x2="420" y2="665" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="420" y1="665" x2="340" y2="805" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="420" y1="665" x2="530" y2="780" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="340" y1="805" x2="290" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="530" y1="780" x2="620" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="760" x2="540" y2="780" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="750" class="label">Build rhythm</text>
  <text x="80" y="1080" class="hint">Last two steps should be quick and controlled.</text>
</svg>
