<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Tuck Jump Step 2 - Drive Up and Tuck</title>
  <desc id="desc">Athlete is airborne while lifting knees toward chest and swinging arms forward for momentum.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#effff6" />
      <stop offset="100%" stop-color="#d8f9e8" />
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)" />
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#ffffff" stroke="#bbf7d0" stroke-width="4" />

  <text x="80" y="130" class="title">Step 2: Tuck In Air</text>
  <text x="80" y="178" class="subtitle">Explode upward and bring knees toward chest</text>

  <line x1="130" y1="980" x2="770" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round" />

  <path d="M450 820 C420 760, 405 700, 420 630" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="14 12" marker-end="url(#arrow)" />
  <path d="M500 820 C530 760, 545 700, 530 630" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="14 12" marker-end="url(#arrow)" />

  <circle cx="475" cy="340" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5" />
  <line x1="475" y1="400" x2="475" y2="590" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="475" y1="460" x2="365" y2="430" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <line x1="475" y1="460" x2="585" y2="430" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <line x1="475" y1="590" x2="410" y2="650" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="410" y1="650" x2="450" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <line x1="475" y1="590" x2="540" y2="650" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <line x1="540" y1="650" x2="500" y2="700" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />

  <ellipse cx="450" cy="710" rx="42" ry="12" fill="#1e293b" />
  <ellipse cx="500" cy="710" rx="42" ry="12" fill="#1e293b" />

  <line x1="130" y1="420" x2="345" y2="430" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)" />
  <text x="90" y="405" class="label">Arms drive</text>

  <line x1="640" y1="640" x2="545" y2="665" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)" />
  <text x="640" y="630" class="label">Knees high</text>

  <text x="80" y="1080" class="hint">Keep torso braced to control the tuck at peak height.</text>
</svg>
