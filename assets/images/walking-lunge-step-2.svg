<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Walking Lunge Step 2 - Step Forward</title>
  <desc id="desc">Athlete takes a long controlled step forward to set up a strong lunge position.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#effff6"/>
      <stop offset="100%" stop-color="#d8f9e8"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .sub { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 27px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#16a34a" />
    </marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 2: Step Out</text>
  <text x="80" y="178" class="sub">Take a long stride and stay balanced</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <circle cx="470" cy="360" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="470" y1="420" x2="460" y2="640" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="465" y1="500" x2="390" y2="580" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="465" y1="500" x2="550" y2="580" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="460" y1="640" x2="370" y2="760" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="370" y1="760" x2="320" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="460" y1="640" x2="560" y2="790" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="560" y1="790" x2="610" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="320" cy="970" rx="50" ry="14" fill="#1e293b"/>
  <ellipse cx="610" cy="970" rx="50" ry="14" fill="#1e293b"/>
  <line x1="620" y1="760" x2="575" y2="795" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="750" class="label">Long stride</text>
  <line x1="620" y1="930" x2="540" y2="960" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="920" class="label">Heel grounded</text>
  <text x="80" y="1080" class="hint">Land heel-to-midfoot on the lead leg.</text>
</svg>
