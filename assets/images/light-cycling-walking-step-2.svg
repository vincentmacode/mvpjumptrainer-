<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Light Cardio Step 2 - Maintain Rhythm</title>
  <desc id="desc">Athlete keeps a smooth cadence to promote recovery without fatigue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#effff6"/><stop offset="100%" stop-color="#d8f9e8"/></linearGradient>
    <style>.title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; } .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; } .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; } .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 2: Steady Pace</text>
  <text x="80" y="178" class="subtitle">Keep low intensity for 15-20 minutes</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <circle cx="460" cy="370" r="58" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="460" y1="428" x2="460" y2="640" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="460" y1="510" x2="370" y2="590" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="460" y1="510" x2="550" y2="590" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="460" y1="640" x2="410" y2="800" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="460" y1="640" x2="520" y2="800" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="400" cy="910" rx="70" ry="20" fill="none" stroke="#334155" stroke-width="8"/>
  <ellipse cx="530" cy="910" rx="70" ry="20" fill="none" stroke="#334155" stroke-width="8"/>
  <line x1="630" y1="890" x2="560" y2="900" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="630" y="880" class="label">Smooth cadence</text>
  <text x="80" y="1080" class="hint">You should be able to talk in full sentences.</text>
</svg>
