<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Deadlift Step 3 - Lockout and Return</title>
  <desc id="desc">Athlete stands tall at lockout, then controls bar down to start position.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6ed"/><stop offset="100%" stop-color="#ffe8d4"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 3: Lockout</text>
  <text x="80" y="178" class="subtitle">Stand tall, squeeze glutes, then hinge down</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <line x1="320" y1="880" x2="580" y2="880" stroke="#111827" stroke-width="14"/>
  <circle cx="450" cy="330" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="450" y1="390" x2="450" y2="620" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="460" x2="370" y2="540" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="450" y1="460" x2="530" y2="540" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="450" y1="620" x2="400" y2="800" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="400" y1="800" x2="390" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="620" x2="500" y2="800" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="500" y1="800" x2="510" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="610" x2="520" y2="640" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="600" class="label">Glute squeeze</text>
  <line x1="620" y1="870" x2="540" y2="880" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="860" class="label">Control descent</text>
  <text x="80" y="1080" class="hint">Finish tall without leaning backward.</text>
</svg>
