<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Plank Variation Step 1 - Forearm Setup</title>
  <desc id="desc">Athlete sets forearms under shoulders and extends legs to prepare for a stable plank.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#d9e9ff"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 27px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 1: Set Base</text>
  <text x="80" y="178" class="sub">Forearms down, toes tucked, neck neutral</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="320" cy="620" r="48" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="355" y1="640" x2="540" y2="690" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="540" y1="690" x2="690" y2="760" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="690" y1="760" x2="760" y2="920" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="420" y1="660" x2="360" y2="770" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="455" y1="670" x2="410" y2="780" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="360" cy="780" rx="34" ry="10" fill="#1e293b"/>
  <ellipse cx="410" cy="790" rx="34" ry="10" fill="#1e293b"/>
  <ellipse cx="760" cy="930" rx="38" ry="12" fill="#1e293b"/>
  <line x1="620" y1="690" x2="560" y2="700" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="680" class="label">Core tight</text>
  <line x1="620" y1="920" x2="550" y2="920" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="910" class="label">Heels long</text>
  <text x="80" y="1080" class="hint">Align ears, shoulders, hips, and heels.</text>
</svg>
