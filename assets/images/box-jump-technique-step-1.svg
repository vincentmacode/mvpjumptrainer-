<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="t d">
  <title id="t">Box Jump Step 1 - Box Setup and Load</title>
  <desc id="d">Athlete faces low box and loads hips with arms back before jumping.</desc>
  <defs>
    <style>.label { font: 600 27px Arial; fill: #0f172a; } .hint { font: 500 24px Arial; fill: #334155; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="#e8f2ff"/>
  <rect x="40" y="40" width="820" height="1120" rx="28" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" font-size="52" font-family="Arial" font-weight="700" fill="#0f172a">Step 1: Load Before Box</text>
  <text x="80" y="185" font-size="30" font-family="Arial" fill="#1e3a8a">Hips back, chest up, eyes on box</text>
  <rect x="650" y="760" width="140" height="220" fill="#475569" rx="8"/>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8"/>
  <circle cx="420" cy="420" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="420" y1="476" x2="400" y2="690" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="400" y1="690" x2="320" y2="815" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="400" y1="690" x2="510" y2="805" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="320" y1="815" x2="300" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="510" y1="805" x2="560" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="610" y1="760" x2="655" y2="760" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="540" y="750" class="label">Low box</text>
  <text x="80" y="1080" class="hint">Load through hips before jumping, not knees only.</text>
</svg>
