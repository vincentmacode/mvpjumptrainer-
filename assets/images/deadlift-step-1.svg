<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Deadlift Step 1 - Setup At Bar</title>
  <desc id="desc">Athlete sets feet under hips, grips the bar, and braces before lifting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#d9e9ff"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #1e3a8a; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #0f172a; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 1: Deadlift Setup</text>
  <text x="80" y="178" class="subtitle">Midfoot under bar, lats tight, chest proud</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="920" x2="600" y2="920" stroke="#111827" stroke-width="14"/>
  <circle cx="450" cy="420" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="450" y1="480" x2="450" y2="690" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="560" x2="360" y2="670" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="450" y1="560" x2="540" y2="670" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="450" y1="690" x2="390" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="390" y1="820" x2="370" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="690" x2="510" y2="820" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="510" y1="820" x2="530" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="620" y1="640" x2="540" y2="680" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="630" class="label">Lats tight</text>
  <line x1="620" y1="900" x2="540" y2="920" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="890" class="label">Bar over midfoot</text>
  <text x="80" y="1080" class="hint">Brace before lift-off and keep spine neutral.</text>
</svg>
