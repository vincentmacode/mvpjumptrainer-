<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="t d">
  <title id="t">Depth Jump Step 3 - Rebound Up</title>
  <desc id="d">Athlete rebounds vertically after landing to train reactive strength.</desc>
  <defs>
    <style>.label { font: 600 27px Arial; fill: #7c2d12; } .hint { font: 500 24px Arial; fill: #9a3412; }</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="1200" fill="#fff2e8"/>
  <rect x="40" y="40" width="820" height="1120" rx="28" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <text x="80" y="130" font-size="52" font-family="Arial" font-weight="700" fill="#7c2d12">Step 3: Reactive Jump</text>
  <text x="80" y="185" font-size="30" font-family="Arial" fill="#c2410c">Explode up immediately after contact</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8"/>
  <circle cx="500" cy="320" r="56" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="500" y1="376" x2="500" y2="590" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="500" y1="590" x2="455" y2="720" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="500" y1="590" x2="545" y2="720" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="455" cy="730" rx="36" ry="10" fill="#1e293b"/>
  <ellipse cx="545" cy="730" rx="36" ry="10" fill="#1e293b"/>
  <line x1="620" y1="720" x2="550" y2="720" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="710" class="label">Reactive jump</text>
  <text x="80" y="1080" class="hint">Think springy, vertical, and quick off the ground.</text>
</svg>
