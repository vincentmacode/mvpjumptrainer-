<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Deadlift Step 2 - Drive Through Floor</title>
  <desc id="desc">Athlete pushes the floor away and lifts bar close to body with neutral spine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#effff6"/><stop offset="100%" stop-color="#d8f9e8"/></linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .subtitle { font: 500 30px 'Barlow', Arial, sans-serif; fill: #166534; }
      .label { font: 600 28px 'Barlow', Arial, sans-serif; fill: #052e16; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #14532d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 2: First Pull</text>
  <text x="80" y="178" class="subtitle">Push floor away, bar tracks up shins</text>
  <line x1="130" y1="980" x2="770" y2="980" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <line x1="330" y1="840" x2="570" y2="840" stroke="#111827" stroke-width="14"/>
  <circle cx="460" cy="360" r="60" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="460" y1="420" x2="460" y2="640" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="460" y1="500" x2="380" y2="590" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="460" y1="500" x2="540" y2="590" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="460" y1="640" x2="400" y2="790" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="400" y1="790" x2="380" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="460" y1="640" x2="520" y2="790" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="520" y1="790" x2="540" y2="960" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="180" y1="845" x2="320" y2="845" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="90" y="835" class="label">Bar close</text>
  <line x1="620" y1="700" x2="540" y2="760" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="690" class="label">Knees extend</text>
  <text x="80" y="1080" class="hint">Keep chest and hips rising together.</text>
</svg>
