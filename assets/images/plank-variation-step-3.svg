<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Plank Variation Step 3 - Add Variation</title>
  <desc id="desc">Athlete performs a plank variation such as shoulder taps while keeping hips stable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6ed"/>
      <stop offset="100%" stop-color="#ffe8d4"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .sub { font: 500 30px 'Barlow', Arial, sans-serif; fill: #c2410c; }
      .label { font: 600 27px 'Barlow', Arial, sans-serif; fill: #7c2d12; }
      .hint { font: 500 24px 'Barlow', Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ea580c" />
    </marker>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect x="40" y="40" width="820" height="1120" rx="36" fill="#fff" stroke="#fed7aa" stroke-width="4"/>
  <text x="80" y="130" class="title">Step 3: Progression</text>
  <text x="80" y="178" class="sub">Lift one hand for taps without rotating hips</text>
  <line x1="120" y1="980" x2="780" y2="980" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="330" cy="610" r="48" fill="#f8c9a1" stroke="#334155" stroke-width="5"/>
  <line x1="365" y1="630" x2="560" y2="660" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="560" y1="660" x2="730" y2="710" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="730" y1="710" x2="790" y2="870" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <line x1="430" y1="650" x2="365" y2="760" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="470" y1="656" x2="530" y2="560" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="365" cy="770" rx="34" ry="10" fill="#1e293b"/>
  <ellipse cx="530" cy="560" rx="30" ry="9" fill="#1e293b"/>
  <ellipse cx="790" cy="880" rx="38" ry="12" fill="#1e293b"/>
  <line x1="620" y1="560" x2="545" y2="560" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="550" class="label">Tap with control</text>
  <line x1="620" y1="860" x2="550" y2="860" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="620" y="850" class="label">Hips level</text>
  <text x="80" y="1080" class="hint">Move slowly and keep pelvis level side-to-side.</text>
</svg>
